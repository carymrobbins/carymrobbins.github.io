<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cary Robbins</title>
  <meta name="description" content="Cary Robbins — musician and software developer.">
  <link rel="icon" href="/assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">

  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/landing.css">
</head>
<body>
  <!-- © 2026 Cary Robbins. All rights reserved. -->
  <span class="hero__brand">Cary Robbins</span>
  <div class="hero">
  <a class="hero__half hero__half--music" href="/music" aria-label="Music — Cary Robbins">
    <video
      class="hero__media"
      poster="/assets/video/music-poster.jpg"
      autoplay muted loop playsinline preload="none"
      aria-hidden="true"
    >
      <source src="/assets/video/music-loop.webm" type="video/webm">
      <source src="/assets/video/music-loop.mp4" type="video/mp4">
    </video>
    <span class="hero__label">MUSIC</span>
  </a>

  <a class="hero__half hero__half--dev" href="/dev" aria-label="Dev — Cary Robbins">
    <video
      class="hero__media"
      poster="/assets/video/dev-poster.jpg"
      autoplay muted loop playsinline preload="none"
      aria-hidden="true"
    >
      <source src="/assets/video/dev-loop.webm" type="video/webm">
      <source src="/assets/video/dev-loop.mp4" type="video/mp4">
    </video>
    <span class="hero__label">DEV</span>
  </a>

  <div class="hero__seam" aria-hidden="true"></div>

</html>
